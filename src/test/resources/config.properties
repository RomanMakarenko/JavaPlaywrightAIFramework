# Default framework configuration. Env vars override these values (see CLAUDE.md):
#   APP_ENV, BROWSER, HEADLESS, BASE_URL, TEST_TIMEOUT, RETRIES, TEST_USER_EMAIL, TEST_USER_PASSWORD
# Per-machine overrides (never committed): copy the keys you want to change into
# config.local.properties (gitignored) — it is merged on top of this file; env vars still win.
browser=chromium
headless=true

# Target environment (dev/stage/prod). All three resolve to the SAME shared URL today; the
# active one is picked via env.<app.env>.url, so real per-env URLs can be added later without
# touching tests. An explicit BASE_URL env var still wins over the per-environment URL.
app.env=prod
env.dev.url=https://funtime.com.ua
env.stage.url=https://funtime.com.ua
env.prod.url=https://funtime.com.ua

test.timeout=30000
retries=0

# Real test credentials for the login happy-path test (utils/DataFactory).
# Leave blank unless a dedicated test account exists; the test then SKIPS with a clear reason.
#   TEST_USER_EMAIL / TEST_USER_PASSWORD env vars override these.
test.user.email=
test.user.password=

# Jira bug pipeline (Phase 15): on test failure, auto-file a Bug ticket with a screenshot.
# Active ONLY when jira.tickets.enabled=true AND url/email/api.token/project.key are all set
# (ConfigReader.isJiraConfigured()). The API token is a SECRET: never commit it here, put it in
# config.local.properties (gitignored) or in CI secrets — never in the Allure report either.
#   JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN / JIRA_TICKETS_ENABLED /
#   JIRA_PROJECT_KEY / JIRA_ISSUE_TYPE / JIRA_LABELS env vars override these.
jira.tickets.enabled=false
jira.base.url=
jira.email=
jira.api.token=
jira.project.key=
jira.issue.type=Bug
jira.labels=auto-test