name: CI

# JavaPlaywrightAIFramework — GitHub Actions CI (docs/IMPLEMENTATION_PLAN.md, Phase 11).
#
# Behaviour
#   * push to main        → full suite (all groups) + publish the Allure report to GitHub Pages
#   * pull request        → fast smoke group only (hermetic sanity + funtime.com.ua E2E)
#   * workflow_dispatch   → full suite, manual trigger
#
# Every run also uploads the Allure results + generated report as build artifacts, so a failing
# run still produces failure screenshots and a browsable report via the run's "Artifacts" tab.
#
# Report publishing (Phase 11.2 decision): the report is generated with `mvn allure:report`
# (bundles its own Allure generator — no global CLI, reads `allurerc.json` for categories) and
# deployed to the `gh-pages` branch with peaceiris/actions-gh-pages. First deploy requires the
# repo's Pages source to point at the `gh-pages` branch (Settings → Pages). PR runs skip it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev/stage/prod all point at the shared URL for now)
        type: choice
        default: prod
        options: [dev, stage, prod]
      browser:
        description: Browser to run the suite on
        type: choice
        default: chromium
        options: [chromium, firefox, webkit, msedge]
      create-jira-tickets:
        description: File Jira tickets on failures (main pushes always do; this forces it for a manual run)
        type: boolean
        default: false
      run-jira-ci-probe:
        description: Fail the dedicated CI Jira probe test to verify the auto-ticket pipeline (set create-jira-tickets too)
        type: boolean
        default: false

# One run per branch at a time; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ github.event_name == 'pull_request' && 'smoke' || 'full suite' }} · ${{ inputs.browser || 'chromium' }} · ${{ inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # JDK 21 (Temurin) with the Maven dependency cache (keyed on pom.xml by setup-java).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Playwright browser binaries are downloaded once per pom change and cached for the runner
      # (~/.cache/ms-playwright on Linux). Restores in seconds on warm caches.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ inputs.browser || 'chromium' }}-${{ hashFiles('pom.xml') }}

      # Same command documented in README/CLAUDE.md. --with-deps installs the OS libraries the
      # selected browser needs on a bare runner (sudo apt under the hood — GitHub runners allow it).
      # chromium/firefox/webkit download into the cached ms-playwright dir; msedge installs
      # system-wide via apt (NOT cached in ~/.cache/ms-playwright), so msedge runs pay a
      # ~1-2 min re-install — best-effort on the Linux runner.
      - name: Install Playwright browsers (${{ inputs.browser || 'chromium' }} + OS deps)
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ inputs.browser || 'chromium' }}"

      # The Phase 10 style gate, enforced in CI so it is more than a local hook: hard-block
      # rules (Thread.sleep, missing BaseTest, assertion imports in POs) fail the build here.
      - name: Enforce framework conventions (style-check.sh hard rules)
        run: |
          status=0
          while IFS= read -r f; do
            bash .claude/scripts/style-check.sh "$f" || status=1
          done < <(find src -name '*.java')
          exit "$status"

      # Fast PR feedback: smoke group (~15 s locally). On main: every group (smoke + regression).
      # Regression's valid-user login test skips itself when TEST_USER_EMAIL/PASSWORD are unset.
      # Secrets are NOT exposed to steps automatically — they must be mapped to env vars explicitly,
      # which is how ConfigReader picks them up (System.getenv, falling back to config.properties).
      #
      # Jira bug pipeline (Phase 15): JIRA_TICKETS_ENABLED is true on main pushes (full suite) or
      # when a manual run opted in — PR runs never file tickets, so the smoke feedback loop never
      # spams Jira. The Jira credentials come from repo secrets, never from the workflow source.
      #
      # CI Jira probe verification: a manual dispatch with run-jira-ci-probe=true swaps the suite
      # to the dedicated probe suite (-Pjira-probe → testng-jira-probe.xml) and arms JIRA_CI_PROBE,
      # so JiraCiProbeTest deliberately fails and JiraBugListener files a Bug ticket. Normal runs
      # never see the probe: the flag is only set by that one dispatch input.
      - name: Run tests (smoke on PR, full suite on main, Jira probe when armed)
        env:
          APP_ENV: ${{ inputs.environment || 'prod' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          # SCRUM is team-managed (next-gen): the REST API cannot add issue types to its scheme
          # (JSWCLOUD-23545), so "Bug" must exist in the project UI. JIRA_ISSUE_TYPE=Bug is set here
          # so auto-filed tickets are literal Bug issues (default jira.issue.type=Bug in config).
          JIRA_ISSUE_TYPE: ${{ secrets.JIRA_ISSUE_TYPE }}
          JIRA_TICKETS_ENABLED: ${{ (inputs.run-jira-ci-probe == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.create-jira-tickets == 'true')) && 'true' || 'false' }}
          JIRA_CI_PROBE: ${{ inputs.run-jira-ci-probe == 'true' && 'true' || 'false' }}
        run: mvn clean test ${{ inputs.run-jira-ci-probe == 'true' && '-Pjira-probe' || (github.event_name == 'pull_request' && '-Dgroups=smoke' || '') }}

      # Always generate/upload the report, even when tests fail, so the run carries failure
      # screenshots + a browsable report. `allurerc.json` (root) drives the failure categories.
      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure results (failure screenshots live here)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

  # Publish the report to GitHub Pages on main. Runs only after `test` succeeds, so a broken
  # build never replaces the published report (its artifacts remain downloadable from the run).
  pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # peaceiris pushes to the gh-pages branch
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: report

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          publish_branch: gh-pages